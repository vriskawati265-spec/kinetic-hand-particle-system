<body>

<div id="ui">INITIALIZING...</div>
<video id="video" autoplay playsinline></video>
<canvas id="c"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver }
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const ui = document.getElementById("ui");
const video = document.getElementById("video");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* ================= PARTICLES ================= */
const COUNT = 2500;

const particles = [];

class P{
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.vx=0;
    this.vy=0;
    this.tx=this.x;
    this.ty=this.y;
  }

  update(){
    let dx = this.tx - this.x;
    let dy = this.ty - this.y;

    this.vx += dx * 0.02;
    this.vy += dy * 0.02;

    this.vx *= 0.85;
    this.vy *= 0.85;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw(){
    ctx.fillStyle="#00f2ff";
    ctx.shadowBlur=12;
    ctx.shadowColor="#00f2ff";
    ctx.fillRect(this.x,this.y,2,2);
  }
}

for(let i=0;i<COUNT;i++) particles.push(new P());

function assign(targets){
  for(let i=0;i<particles.length;i++){
    let t = targets[i % targets.length];
    particles[i].tx = t.x + canvas.width/2;
    particles[i].ty = t.y + canvas.height/2;
  }
}

/* ================= SHAPES ================= */

function circle(){
  const pts=[];
  for(let i=0;i<COUNT;i++){
    let a = i/COUNT * Math.PI*2;
    pts.push({
      x: Math.cos(a)*200,
      y: Math.sin(a)*200
    });
  }
  assign(pts);
}

function heart(){
  const pts=[];
  for(let i=0;i<COUNT;i++){
    let t=i/COUNT*Math.PI*2;
    pts.push({
      x:16*Math.pow(Math.sin(t),3)*12,
      y:-(13*Math.cos(t)-5*Math.cos(2*t))*12
    });
  }
  assign(pts);
}
