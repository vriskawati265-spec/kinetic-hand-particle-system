<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Hand FIX FULL</title>

<style>
body{margin:0;background:#000;overflow:hidden}
canvas{position:fixed;top:0;left:0}

#ui{
  position:fixed;top:20px;left:20px;
  color:#00f2ff;font-family:Arial;
  text-shadow:0 0 10px #00f2ff;
  z-index:10;
}

#cam{
  position:fixed;bottom:20px;right:20px;
  width:160px;border-radius:12px;
  transform:scaleX(-1);
  border:2px solid #00f2ff;
  z-index:10;
}
</style>
</head>

<body>

<div id="ui">🔄 INIT...</div>
<video id="cam" autoplay playsinline></video>
<canvas id="c"></canvas>

<script type="module">

import { HandLandmarker, FilesetResolver }
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

/* ===== UI ===== */
const ui = document.getElementById("ui");
const video = document.getElementById("cam");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* ===== RESIZE SAFE ===== */
window.addEventListener("resize",()=>{
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});

/* ===== PARTICLE SYSTEM ===== */
const PCOUNT = 1200;
const ps = [];

for(let i=0;i<PCOUNT;i++){
  ps.push({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    vx:0,vy:0,
    tx:innerWidth/2,
    ty:innerHeight/2
  });
}

/* bentuk awal */
function setIdle(){
  for(let p of ps){
    p.tx = innerWidth/2;
    p.ty = innerHeight/2;
  }
}

/* bentuk lingkaran */
function setCircle(){
  for(let i=0;i<ps.length;i++){
    let a=i/ps.length*Math.PI*2;
    ps[i].tx = innerWidth/2 + Math.cos(a)*180;
    ps[i].ty = innerHeight/2 + Math.sin(a)*180;
  }
}

/* ===== RENDER (INI YANG WAJIB HIDUP) ===== */
function update(){

  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(0,0,innerWidth,innerHeight);

  ctx.fillStyle="#00f2ff";
  ctx.shadowBlur=15;
  ctx.shadowColor="#00f2ff";

  for(let p of ps){

    let dx=p.tx-p.x;
    let dy=p.ty-p.y;

    p.vx+=dx*0.015;
    p.vy+=dy*0.015;

    p.vx*=0.85;
    p.vy*=0.85;

    p.x+=p.vx;
    p.y+=p.vy;

    ctx.fillRect(p.x,p.y,2,2);
  }

  requestAnimationFrame(update);
}

/* ===== CAMERA SAFE ===== */
async function startCamera(){
  try{
    ui.innerText="📷 CAMERA...";
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
    await video.play();
    ui.innerText="🟢 CAMERA OK";
  }catch(e){
    ui.innerText="🔴 CAMERA BLOCKED";
    console.log(e);
  }
}

/* ===== AI SAFE ===== */
let hand = null;

async function startAI(){
  try{
    ui.innerText="🧠 LOADING AI...";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
    );

    hand = await HandLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },
      runningMode:"VIDEO",
      numHands:1
    });

    ui.innerText="🟢 AI READY";

  }catch(e){
    ui.innerText="⚠️ AI FAILED (fallback mode)";
    console.log(e);
  }
}

/* ===== DETECT SAFE ===== */
let last=0;

function detect(){
  if(!hand) return;
  if(video.readyState < 2) return;

  let now=performance.now();
  if(now-last<50) return;
  last=now;

  try{
    const res = hand.detectForVideo(video, now);

    if(!res.landmarks?.length){
      return;
    }

    const fingers=[8,12,16,20]
    .map(i=>res.landmarks[0][i].y < res.landmarks[0][i-2].y);

    if(fingers.filter(Boolean).length>=4){
      setCircle();
    }else{
      setIdle();
    }

  }catch(e){
    console.log("detect error",e);
  }
}

/* ===== LOOP (WAJIB STABIL) ===== */
function loop(){
  detect();
  update();
  requestAnimationFrame(loop);
}

/* ===== START SAFE ===== */
(async()=>{
  await startCamera();
  await startAI();
  setIdle();
  update();
  loop();
})();
</script>

</body>
</html>
