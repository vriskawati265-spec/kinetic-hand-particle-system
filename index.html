<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Kinetic Particle System</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
        }

        #webcam-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 220px;
            height: 165px;
            border-radius: 15px;
            border: 2px solid #00f2ff;
            overflow: hidden;
            transform: scaleX(-1);
            z-index: 10;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas { position: fixed; top: 0; left: 0; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div>Neural Engine Active</div>
    <div id="gesture-name">INITIALIZING...</div>
</div>

<div id="webcam-container">
    <video id="webcam" autoplay playsinline></video>
</div>

<canvas id="canvas"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver } 
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const video = document.getElementById("webcam");
const gestureText = document.getElementById("gesture-name");

let handLandmarker;
let lastTime = 0;

const PARTICLES = 1200;
const particles = [];
let targets = [];

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
window.addEventListener("resize", resize);
resize();

class P {
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.vx = 0;
        this.vy = 0;
        this.tx = this.x;
        this.ty = this.y;
    }
    update(){
        this.vx += (this.tx - this.x)*0.05;
        this.vy += (this.ty - this.y)*0.05;
        this.vx *= 0.85;
        this.vy *= 0.85;
        this.x += this.vx;
        this.y += this.vy;
    }
    draw(){
        ctx.fillStyle = "#00f2ff";
        ctx.fillRect(this.x,this.y,2,2);
    }
}

for(let i=0;i<PARTICLES;i++) particles.push(new P());

function setShape(pts){
    particles.forEach((p,i)=>{
        const pt = pts[i % pts.length];
        p.tx = pt.x + canvas.width/2;
        p.ty = pt.y + canvas.height/2;
    });
}

function heart(){
    let pts=[];
    for(let i=0;i<PARTICLES;i++){
        let t=i/PARTICLES*Math.PI*2;
        pts.push({
            x:16*Math.pow(Math.sin(t),3)*10,
            y:- (13*Math.cos(t)-5*Math.cos(2*t))*10
        });
    }
    setShape(pts);
}

function cloud(){
    let pts=[];
    for(let i=0;i<PARTICLES;i++){
        pts.push({
            x:(Math.random()-0.5)*400,
            y:(Math.random()-0.5)*400
        });
    }
    setShape(pts);
}

async function init(){

    // CAMERA FIX
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;

    await new Promise(res=>{
        video.onloadeddata = ()=>res();
    });

    // MEDIA PIPE LOAD
    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
    );

    handLandmarker = await HandLandmarker.createFromOptions(vision,{
        baseOptions:{
            modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
        },
        runningMode:"VIDEO",
        numHands:1
    });

    requestAnimationFrame(loop);
}

function detect(){
    if(!handLandmarker) return;
    if(video.readyState < 2) return;

    const now = performance.now();
    if(now - lastTime < 50) return;
    lastTime = now;

    const res = handLandmarker.detectForVideo(video, now);

    if(res.landmarks && res.landmarks.length>0){
        gestureText.innerText="HAND DETECTED";
        heart();
    } else {
        gestureText.innerText="NO HAND";
        cloud();
    }
}

function loop(){
    detect();

    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00f2ff";

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    requestAnimationFrame(loop);
}

init();
</script>

</body>
</html>
